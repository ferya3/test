<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>پاک‌کن ایمیل جیمیل</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main>
    <header>
      <h1>پاک‌کن ایمیل جیمیل</h1>
      <div class="account">
        <span id="account">وارد نشده‌اید</span>
        <button id="signIn" type="button" class="secondary">ورود با گوگل</button>
        <button id="signOut" type="button" class="secondary" hidden>خروج</button>
      </div>
    </header>

    <div id="setupWarning" class="alert error" hidden>
      هنوز <code>client_id</code> در فایل <code>manifest.json</code> تنظیم نشده است.
      مراحل راه‌اندازی را در فایل <code>README.md</code> دنبال کنید.
    </div>

    <form id="searchForm" class="card">
      <label>
        عنوان ایمیل
        <input id="subject" type="text" placeholder="مثلاً: Your daily digest" required autofocus>
      </label>
      <div class="row">
        <label>
          فرستنده (اختیاری)
          <input id="from" type="text" placeholder="newsletter@example.com" dir="ltr">
        </label>
        <label>
          قدیمی‌تر از (اختیاری)
          <select id="olderThan">
            <option value="">همه</option>
            <option value="7d">۱ هفته</option>
            <option value="1m">۱ ماه</option>
            <option value="3m">۳ ماه</option>
            <option value="6m">۶ ماه</option>
            <option value="1y">۱ سال</option>
            <option value="2y">۲ سال</option>
          </select>
        </label>
      </div>
      <label class="check">
        <input id="includeSpamTrash" type="checkbox">
        اسپم و سطل زباله را هم بگرد
      </label>
      <div class="actions">
        <button id="searchBtn" type="submit">جستجو</button>
        <span class="query">کوئری جیمیل: <code id="queryPreview" dir="ltr"></code></span>
      </div>
    </form>

    <section id="progressCard" class="card" hidden>
      <div id="status"></div>
      <progress id="progress" max="1" value="0"></progress>
      <button id="cancelBtn" type="button" class="secondary">توقف</button>
    </section>

    <div id="message" class="alert" hidden></div>

    <section id="results" class="card" hidden>
      <div class="results-head">
        <h2 id="resultCount"></h2>
        <div class="actions">
          <button id="trashBtn" type="button">انتقال همه به سطل زباله</button>
          <button id="deleteBtn" type="button" class="danger">حذف دائمی همه</button>
        </div>
      </div>
      <p id="previewNote" class="muted"></p>
      <table>
        <thead>
          <tr><th>عنوان</th><th>فرستنده</th><th>تاریخ</th></tr>
        </thead>
        <tbody id="previewBody"></tbody>
      </table>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
