# One origin for the browser: the Next.js app at /, the FastAPI API at /api.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  # Resolve the containers through Docker's DNS on every request (cached 10 s). With a fixed
  # `proxy_pass http://api:8000` nginx resolves once at start, and after an update that
  # recreates the api / web containers it keeps sending traffic to their old addresses.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;
  set $web_upstream http://web:3000;

  # screen recordings are large
  client_max_body_size 600m;
  proxy_request_buffering off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/ws/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location / {
    proxy_pass $web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
