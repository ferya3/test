# Recode AI — full stack.
#
#   cp .env.example .env        # add ANTHROPIC_API_KEY (optional: offline mode without it)
#   docker compose build
#   docker compose up -d
#   open http://localhost
#
# nginx (:80) -> web (Next.js) and /api -> api (FastAPI). Celery workers per queue:
# video (FFmpeg/OpenCV), ai (pipeline), code (edits), test (visual QA).

x-backend: &backend
  build: ./backend
  image: recode-backend:latest
  restart: unless-stopped
  env_file: .env
  environment: &backend-env
    RECODE_ENV: production
    RECODE_DATABASE_URL: postgresql+psycopg://recode:${POSTGRES_PASSWORD:-recode}@postgres:5432/recode
    RECODE_REDIS_URL: redis://redis:6379/0
    RECODE_TASK_MODE: celery
    RECODE_STORAGE_BACKEND: s3
    RECODE_STORAGE_ROOT: /data
    RECODE_S3_ENDPOINT_URL: http://minio:9000
    RECODE_S3_BUCKET: recode
    RECODE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-recode}
    RECODE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-recode-secret}
    RECODE_PUBLIC_API_URL: ${PUBLIC_URL:-http://localhost}
    RECODE_CORS_ORIGINS: '["${PUBLIC_URL:-http://localhost}"]'
    # Chromium (visual QA, URL capture) runs inside this non-root container
    RECODE_CHROMIUM_NO_SANDBOX: "true"
  shm_size: 1gb  # Chromium needs more than Docker's 64 MB /dev/shm
  volumes:
    - backend-cache:/data
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    minio: { condition: service_healthy }

# Workers that build generated React projects need the Docker CLI and socket.
# The socket is root-equivalent on the host: in production run these workers on
# a dedicated build host, or point DOCKER_HOST at a rootless / gVisor daemon.
x-builder: &builder
  <<: *backend
  environment:
    <<: *backend-env
    RECODE_SANDBOX_MODE: ${SANDBOX_MODE:-docker}
    RECODE_SANDBOX_IMAGE: recode-sandbox:latest
  group_add: ["${DOCKER_GID:-999}"]
  volumes:
    - backend-cache:/data
    - /var/run/docker.sock:/var/run/docker.sock

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: recode
      POSTGRES_USER: recode
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recode}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recode -d recode"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-recode}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-recode-secret}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--workers", "2"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 10s
      retries: 10

  worker-video:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "video", "-c", "2", "-n", "video@%h", "--loglevel", "INFO"]

  worker-ai:
    <<: *builder
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "ai", "-c", "4", "-n", "ai@%h", "--loglevel", "INFO"]

  worker-code:
    <<: *builder
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "code", "-c", "4", "-n", "code@%h", "--loglevel", "INFO"]

  worker-test:
    <<: *builder
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "test", "-c", "2", "-n", "test@%h", "--loglevel", "INFO"]

  # Build-only: the image generated React projects are built in.
  sandbox-image:
    build: ./infrastructure/docker/sandbox
    image: recode-sandbox:latest
    entrypoint: ["true"]
    restart: "no"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL:-http://localhost}
    restart: unless-stopped
    depends_on: [api]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [web, api]

volumes:
  postgres-data:
  redis-data:
  minio-data:
  backend-cache:
