[project]
name = "recode-ai-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"app/ai/coding/renderer.py" = ["E501"]  # embedded CSS / JS templates
"app/ai/prompts.py" = ["E501"]
"tests/*" = ["E501"]
